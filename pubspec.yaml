name: my_portfolio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Routing
  go_router: ^12.1.1
  url_strategy: ^0.2.0

  # Animations
  flutter_animate: ^4.3.0
  animated_text_kit: ^4.2.2
  lottie: ^2.7.0
  rive: ^0.12.4
  simple_animations: ^5.0.0+3

  # UI Components
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  glassmorphism: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^4.2.1
  timeline_tile: any

  # Utilities
  url_launcher: ^6.2.1
  visibility_detector: ^0.4.0+2
  scrollable_positioned_list: ^0.3.8
  responsive_framework: ^1.1.1
  
  # Effects
  particles_flutter: ^0.1.4
  shimmer: ^3.0.0

  # Assets
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/projects/
